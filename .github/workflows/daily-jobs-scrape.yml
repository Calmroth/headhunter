name: Daily jobs refresh + deploy

# Reads every firm's recorded job source, reconciles src/data/jobs.ts, verifies
# the production build, then pushes to main — Vercel's Git Integration
# auto-deploys the new commit.
#
# NO API KEY, NO MODEL, NO COST. This replaced a Claude-in-CI step that
# re-derived "where does this firm list its jobs?" for every firm on every run.
# That answer changes about once a year, so it is recorded in
# src/data/jobSources.ts instead and the daily job is plain HTTP.
#
# When firms are added, or when a run reports a source that stopped working:
#   npm run discover:jobs          # probe only firms with no source
#   npm run discover:jobs -- --all # re-probe everything
# Discovery is also deterministic — it probes known ATS endpoints and records
# only what returned real postings — so it costs nothing either.

on:
  schedule:
    - cron: '19 6 * * *'   # 06:19 UTC daily (~08:19 Europe/Stockholm summer)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write           # allow committing + pushing back to the repo

concurrency:
  group: jobs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Guards the classifier and the reconciliation rules before they are let
      # near the roster. A broken "unreachable keeps its listings" rule would
      # quietly delete real jobs.
      - name: Test the jobs pipeline
        run: npm run test:jobs

      # Probes only firms with no recorded source (fast no-op once all firms
      # are discovered). On first run this bootstraps the JOB_SOURCES registry
      # so the refresh step below has endpoints to call. continue-on-error so
      # a transient network blip in discovery doesn't abort the refresh.
      - name: Discover job sources (new firms only)
        run: npm run discover:jobs
        continue-on-error: true

      - name: Refresh listings
        run: npm run refresh:jobs

      # Runs check:data first, so a listing pointing at a retired firm, or a
      # coordinate that drifted, fails here instead of reaching production.
      - name: Verify production build
        run: npm run build

      - name: Commit & push if changed
        run: |
          git config user.name  "headhunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/jobs.ts src/data/jobSources.ts
          if git diff --cached --quiet; then
            echo "No listing changes this run — nothing to deploy."
          else
            git commit -m "chore(jobs): daily listings refresh"
            git push origin main
          fi
